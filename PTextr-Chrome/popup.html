<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PTextr</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div class="popup-container">
        <!-- Minimal Header -->
        <header class="header">
            <div class="brand">
                <div class="brand-badge">P</div>
                <div>
                    <h1 class="brand-title">PTextr</h1>
                    <span class="brand-sub">AI Text Transformation</span>
                </div>
            </div>
            <div id="statusPill" class="status-pill status-ready">
                <span class="status-dot"></span>
                <span id="statusLabel">Ready</span>
            </div>
        </header>

        <!-- Step 1: Visit Website -->
        <section class="step-card">
            <div class="step-header">
                <span class="step-badge">1</span>
                <div>
                    <h2 class="step-heading">Get your Token</h2>
                    <p class="step-text">Create an account and copy your extension token.</p>
                </div>
            </div>
            <a href="https://ptextr.onrender.com/" id="openWebsiteBtn" class="website-btn" target="_blank" rel="noopener noreferrer">
                <span>Visit PTextr Website</span>
                <span class="btn-arrow">↗</span>
            </a>
        </section>

        <!-- Step 2: Enter Token -->
        <section class="step-card">
            <div class="step-header">
                <span class="step-badge">2</span>
                <div>
                    <label for="tokenInput" class="step-heading">Enter API Token</label>
                    <p class="step-text">Paste your token to enable AI text transformation.</p>
                </div>
            </div>
            <div class="input-wrapper">
                <input type="password" id="tokenInput" class="input-field" placeholder="Paste your extension token" autocomplete="off" spellcheck="false">
                <button type="button" id="toggleTokenVisibility" class="icon-btn" title="Toggle visibility" aria-label="Toggle token visibility">
                    <span id="visibilityIcon">👁️</span>
                </button>
            </div>
            <button type="button" id="saveBtn" class="primary-btn">
                <span class="spinner" id="btnSpinner"></span>
                <span id="saveBtnText">Save & Connect</span>
            </button>
        </section>

        <!-- Status Message Banner -->
        <div id="statusBanner" class="status-banner" role="status" aria-live="polite">
            <span id="statusIcon" class="status-banner-icon">⚡</span>
            <span id="statusMsg" class="status-banner-msg">Enter token to connect.</span>
        </div>

        <!-- Quick Hint -->
        <div class="usage-hint">
            <span>💡 <b>Usage:</b> Type <code>Hello ;expand_100_words;</code> in any text field.</span>
        </div>

        <!-- Collapsed Advanced Settings -->
        <details class="advanced-drawer">
            <summary class="advanced-summary">Advanced Settings</summary>
            <div class="advanced-body">
                <label for="endpointInput" class="advanced-label">API Endpoint</label>
                <input type="text" id="endpointInput" class="advanced-input" placeholder="https://ptextr.onrender.com/api/process/">
                <div class="advanced-presets">
                    <button type="button" id="presetProd" class="chip-btn">Production</button>
                    <button type="button" id="presetLocal" class="chip-btn">Local</button>
                </div>
            </div>
        </details>
    </div>

    <script src="popup.js"></script>
</body>
</html>
