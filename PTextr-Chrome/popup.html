<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PTextr Settings</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div class="m3-app-container">
        <!-- Header -->
        <header class="m3-header">
            <div class="m3-headline-group">
                <div class="m3-app-badge" aria-hidden="true">P</div>
                <div>
                    <h1 class="m3-headline">PTextr</h1>
                    <p class="m3-subhead">Transform text anywhere</p>
                </div>
            </div>
        </header>

        <!-- Connection Status Card -->
        <div id="statusCard" class="m3-status-card" role="status" aria-live="polite">
            <div class="m3-status-icon" id="statusIcon">⚡</div>
            <div class="m3-status-content">
                <span class="m3-status-title" id="statusTitle">Backend Status</span>
                <span class="m3-status-body" id="statusBody">Not tested yet. Tap "Test Connection" below.</span>
            </div>
        </div>

        <!-- Token Card -->
        <section class="m3-card">
            <div class="m3-card-header">
                <span class="m3-card-title">Authentication</span>
            </div>
            <div class="m3-field-group">
                <label for="tokenInput" class="m3-label">Extension Token</label>
                <div class="m3-input-wrapper">
                    <input type="password" id="tokenInput" class="m3-input" placeholder="Paste your extension token" autocomplete="off">
                    <button type="button" id="toggleTokenVisibility" class="m3-icon-btn" title="Toggle visibility" aria-label="Toggle token visibility">
                        <span id="visibilityIcon">👁️</span>
                    </button>
                </div>
                <p class="m3-supporting-text">Authenticates requests with your Django backend.</p>
            </div>
        </section>

        <!-- Endpoint Card -->
        <section class="m3-card">
            <div class="m3-card-header">
                <span class="m3-card-title">Backend Endpoint</span>
            </div>
            <div class="m3-field-group">
                <div class="m3-chips-row">
                    <button type="button" id="presetLocal" class="m3-chip" aria-label="Set local endpoint">Local (127.0.0.1)</button>
                    <button type="button" id="presetClear" class="m3-chip m3-chip-outline" aria-label="Clear endpoint">Clear</button>
                </div>
                <input type="text" id="endpointInput" class="m3-input" placeholder="http://127.0.0.1:8000/api/process/">
                <p class="m3-supporting-text">Target URL for processing text commands.</p>
            </div>
        </section>

        <!-- Action Buttons -->
        <div class="m3-actions-row">
            <button type="button" id="saveBtn" class="m3-btn m3-btn-tonal">Save</button>
            <button type="button" id="testBtn" class="m3-btn m3-btn-primary">
                <span class="m3-btn-spinner" id="btnSpinner"></span>
                <span id="testBtnText">Test Connection</span>
            </button>
        </div>

        <!-- Footer -->
        <footer class="m3-footer">
            <span>PTextr v1.0.0 • Local Development</span>
        </footer>
    </div>

    <script src="popup.js"></script>
</body>
</html>
