
{% extends 'base.html' %}
{% load static %}

{% block title %}
    PTextr - Settings
{% endblock title %}

{% block content %}
<link rel="stylesheet" href="{% static 'css/core/settings.css' %}">

<div class="m3-settings-container">
    <div class="m3-expressive-card">
        <h2 class="m3-card-title">
            <svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.04.64.09.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
            Settings
        </h2>

        <form action="" method="post" class="m3-settings-form">
            {% csrf_token %}

            <div class="m3-input-group">
                <label for="provider" class="m3-input-label">SELECT MODEL PROVIDER</label>
                <select name="provider" id="provider" class="m3-select-input">
                    <option value="gemini">GEMINI</option>
                </select>
            </div>
            {% if messages %}
                {% for message in messages %}
                    {{message}}
                {% endfor %}
            {% endif %}
            <div class="m3-input-group">
                <label for="model" class="m3-input-label">SELECT MODEL</label>
                <select name="model" id="model" class="m3-select-input">
                    {% for model in model_data %}
                        <option value="{{ model }}"
                            {% if setting and setting.model == model %}selected{% endif %}>
                            {{ model }}
                        </option>
                    {% empty %}
                        <option value="">No models available</option>
                    {% endfor %}
                </select>
            </div>

            <button type="submit" class="m3-btn-filled">Save Model</button>
        </form>
    </div>
</div>
{% endblock content %}
